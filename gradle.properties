org.gradle.jvmargs=-Xmx2G

mod_version=1.8.0
maven_group=com.fantac4t.fsp
archives_base_name=FantasSmartPlaceholders

# loom_version lives here (not per-version) so the plugins{} block can read it at config time.
# Use the latest loom that supports your oldest target MC version.
# 1.17.x is required for MC 26.2 (Vulkan backend support); still builds 1.21.11 and 26.1 fine.
loom_version=1.17.19

# night-config — TOML config parsing/writing, bundled into the jar via JiJ.
nightconfig_version=3.8.1
