# ── Minecraft 26.x (single JAR covers the whole 26.x line) ──────────────────
# Built against 26.1, but minecraft_dep is open-ended (>=26.1) and this has been smoke-tested
# clean on a 26.2 server (registration/init only, not full in-game behavior — see CHANGELOG).
# jar_mc_label makes the shipped jar say "+26.x" instead of "+26.1" since it's the one meant
# for distribution; versions/26.2 still exists as a precisely-pinned fallback if ever needed.
minecraft_version=26.1
minecraft_dep=>=26.1
jar_mc_label=26.x

# Fabric
loader_version=0.19.3
fabric_version=0.145.1+26.1

# Placeholder API (3.0.0 covers all 26.x)
placeholder_api_version=3.0.0+26.1

# Simple Voice Chat API — update if 2.6.13 no longer compiles against 26.x
voicechat_api_version=2.6.13
